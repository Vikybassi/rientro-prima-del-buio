# Sito statico: Netlify pubblica la cartella dist costruita da Vite.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# I file in assets/ hanno l'impronta del contenuto nel nome: possono restare in cache per sempre.
# Tutto il resto (index.html, sw.js, dati dei giri) usa il default di Netlify, che ricontrolla a ogni visita.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
